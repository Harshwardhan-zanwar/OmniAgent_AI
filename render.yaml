services:
  - type: web
    name: omni-agent-ai
    env: python
    region: singapore          # closest to India (Nashik)
    plan: free

    # Install ffmpeg for audio processing + all Python deps
    buildCommand: |
      apt-get update && apt-get install -y ffmpeg mupdf mupdf-tools libmagic1 poppler-utils &&
      pip install --upgrade pip &&
      pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    # Health check — Render pings this to confirm app is alive
    healthCheckPath: /health

    # Auto-deploy when you push to main branch
    autoDeploy: true

    envVars:
      - key: GEMINI_API_KEY
        sync: false            # set manually in Render dashboard

      - key: UPSTASH_REDIS_URL
        sync: false            # set manually in Render dashboard

      - key: ENV
        value: production

      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false            # optional: for Cloud Vision OCR